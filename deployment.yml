---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aws
spec:
  replicas: 2
  selector:
    matchLabels:
      app: swiggy
  template:
    metadata:
      labels:
        app: swiggy

    spec:
      containers:
        - name: cont1
          image: nginx
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: devops
